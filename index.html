<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raid: Shadow Legends - Modular Data Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #030509; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        .top-hud { background: linear-gradient(180deg, #1e293b, #0f172a); display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; border-bottom: 2px solid #b45309; z-index: 20; font-size: 11px; }
        .res-pill { background: rgba(0,0,0,0.85); border: 1px solid #d97706; padding: 4px 8px; border-radius: 12px; font-weight: bold; color: #fef08a; font-size: 10px; }

        .viewport { flex: 1; position: relative; background: #050811; overflow: hidden; }
        .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; padding: 12px; box-sizing: border-box; overflow-y: auto; z-index: 5; }
        .screen.active { display: flex; flex-direction: column; }

        /* KAHRAMAN HANI EKRANI */
        .tavern-wrapper { display: flex; height: 100%; gap: 10px; }
        .hero-sidebar { width: 120px; background: rgba(15,23,42,0.95); border-right: 2px solid #334155; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 4px; border-radius: 6px; }
        .hero-card-thumb { height: 60px; background: #1e293b; border: 2px solid #22c55e; border-radius: 6px; cursor: pointer; font-size: 9px; background-size: cover; background-position: center; position: relative; }
        .hero-card-thumb.active { border-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .hero-thumb-overlay { position: absolute; bottom:0; left:0; width:100%; background: rgba(0,0,0,0.8); padding: 2px; text-align: center; }

        .hero-detail-view { flex: 1; background: rgba(15,23,42,0.92); border: 1px solid #475569; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; }

        /* ÇAĞIRMA GEÇİDİ EKRANI */
        .portal-wrapper { display: flex; height: 100%; gap: 10px; }
        .shard-sidebar { width: 130px; background: rgba(15,23,42,0.95); border-right: 2px solid #334155; display: flex; flex-direction: column; gap: 6px; padding: 4px; border-radius: 6px; }
        .shard-row { background: #1e293b; border: 1px solid #475569; border-radius: 6px; padding: 8px; cursor: pointer; font-size: 10px; text-align: left; color: #f8fafc; }
        .shard-row.active { border-color: #22c55e; background: #0f172a; box-shadow: 0 0 8px rgba(34,197,94,0.4); }

        .btn-action { background: linear-gradient(180deg, #d97706, #b45309); color: white; border: 1px solid #fef08a; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 8px; font-size: 11px; }

        .bottom-footer { background: #070a14; border-top: 2px solid #b45309; display: flex; justify-content: space-around; align-items: center; padding: 6px 2px; z-index: 20; font-size: 9px; }
        .footer-tab { display: flex; flex-direction: column; align-items: center; color: #94a3b8; cursor: pointer; flex: 1; }
        .footer-tab.active { color: #f59e0b; }
    </style>
</head>
<body>

    <div class="top-hud">
        <b>zrto99 (Lvl 47)</b>
        <div style="display:flex; gap:6px;">
            <div class="res-pill">⚡ 86/100</div>
            <div class="res-pill" id="gold-display">🪙 2.39M</div>
            <div class="res-pill">💎 19</div>
        </div>
    </div>

    <div class="viewport">
        <!-- 1. ŞAMPİYONLAR (HAN) EKRANI -->
        <div id="screen-tavern" class="screen active">
            <h3 style="color:#f59e0b; margin-bottom:8px; font-size:13px;">🛡️ Kahraman Veritabanı (Han)</h3>
            <div class="tavern-wrapper">
                <div class="hero-sidebar" id="hero-list-container"></div>
                <div class="hero-detail-view" id="hero-detail-container">
                    <p style="color:#94a3b8;">Şampiyon yükleniyor...</p>
                </div>
            </div>
        </div>

        <!-- 2. ÇAĞIRMA GEÇİDİ EKRANI -->
        <div id="screen-portal" class="screen">
            <h3 style="color:#22c55e; margin-bottom:8px; font-size:13px;">🔮 Çağırma Geçidi (Shards)</h3>
            <div class="portal-wrapper">
                <div class="shard-sidebar" id="shard-list-container"></div>
                <div style="flex:1; background: rgba(15,23,42,0.92); border: 1px solid #475569; border-radius: 8px; padding: 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;" id="shard-detail-container">
                    <p style="color:#94a3b8;">Parça yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-footer">
        <div class="footer-tab active" id="tab-tavern" onclick="openScreen('screen-tavern', this)"><span>🛡️</span>Şampiyonlar</div>
        <div class="footer-tab" id="tab-portal" onclick="openScreen('screen-portal', this)"><span>🔮</span>Geçit</div>
    </div>

    <script>
        let allHeroes = [];
        let allShards = [];
        let gold = 2390000;

        // Verileri JSON dosyalarından çekme
        async function loadGameData() {
            try {
                const resHeroes = await fetch('heroes.json');
                allHeroes = await resHeroes.json();
                renderHeroList();

                const resShards = await fetch('shards.json');
                allShards = await resShards.json();
                renderShardList();
            } catch (e) {
                console.error("Veri yükleme hatası:", e);
            }
        }

        function renderHeroList() {
            const listContainer = document.getElementById('hero-list-container');
            listContainer.innerHTML = '';
            allHeroes.forEach((hero, index) => {
                const card = document.createElement('div');
                card.className = `hero-card-thumb ${index === 0 ? 'active' : ''}`;
                card.style.backgroundImage = `url('${hero.avatar}')`;
                card.innerHTML = `<div class="hero-thumb-overlay"><b>${hero.name}</b></div>`;
                card.onclick = () => selectHero(index);
                listContainer.appendChild(card);
            });
            if (allHeroes.length > 0) selectHero(0);
        }

        function selectHero(index) {
            document.querySelectorAll('.hero-card-thumb').forEach((el, i) => el.classList.toggle('active', i === index));
            const hero = allHeroes[index];
            document.getElementById('hero-detail-container').innerHTML = `
                <div style="display:flex; gap:10px; align-items:center;">
                    <img src="${hero.avatar}" style="width:70px; height:70px; border-radius:6px; border:2px solid #f59e0b; object-fit: cover;">
                    <div>
                        <b style="color:#f59e0b; font-size:12px;">${hero.title}</b><br>
                        <span style="font-size:9px; color:#38bdf8;">${hero.rarity} • ${hero.type}</span><br>
                        <span style="font-size:9px; color:#fef08a;">Güç: ${hero.power.toLocaleString()}</span>
                    </div>
                </div>
                <div style="font-size:10px; margin-top:10px; background:rgba(0,0,0,0.6); padding:8px; border-radius:6px; line-height:1.5;">
                    <b>HP:</b> ${hero.stats.hp} | <b>ATK:</b> ${hero.stats.atk}<br>
                    <b>DEF:</b> ${hero.stats.def} | <b>HIZ:</b> ${hero.stats.speed}
                </div>
            `;
        }

        function renderShardList() {
            const listContainer = document.getElementById('shard-list-container');
            listContainer.innerHTML = '';
            allShards.forEach((shard, index) => {
                const row = document.createElement('div');
                row.className = `shard-row ${index === 0 ? 'active' : ''}`;
                row.innerHTML = `${shard.icon} <b>${shard.name}</b>`;
                row.onclick = () => selectShard(index);
                listContainer.appendChild(row);
            });
            if (allShards.length > 0) selectShard(0);
        }

        function selectShard(index) {
            document.querySelectorAll('.shard-row').forEach((el, i) => el.classList.toggle('active', i === index));
            const shard = allShards[index];
            document.getElementById('shard-detail-container').innerHTML = `
                <div style="font-size:50px; margin-bottom:6px;">${shard.icon}</div>
                <b style="color:#f59e0b; font-size:13px;">${shard.name}</b>
                <p style="font-size:9px; color:#94a3b8; margin:4px 0;">${shard.description}</p>
                <span style="font-size:9px; color:#22c55e; margin-bottom:8px;">İçerik: ${shard.rarity}</span>
                <button class="btn-action" onclick="summonShard('${shard.name}', ${shard.cost})">${shard.cost} ${shard.currency} - Çağır</button>
            `;
        }

        function summonShard(name, cost) {
            if (gold >= cost) {
                gold -= cost;
                document.getElementById('gold-display').innerText = `🪙 ${(gold/1000000).toFixed(2)}M`;
                alert(`🎉 Başarıyla ${name} kullanıldı ve şampiyon çağrıldı!`);
            } else {
                alert("❌ Yetersiz kaynak!");
            }
        }

        function openScreen(id, tabEl) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.footer-tab').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            tabEl.classList.add('active');
        }

        loadGameData();
    </script>
</body>
</html>
